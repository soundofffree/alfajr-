<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جريدة الفجر المستقلة - السودان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html{background:#fff}
body{margin:0;background:#fff;color:#000;font-family:"Noto Naskh Arabic",Tahoma,serif;font-size:18px;line-height:1.9;padding-bottom:env(safe-area-inset-bottom,0px)}
.mast{background:#000;color:#fff;text-align:center;padding:calc(22px + env(safe-area-inset-top,0px)) 16px 22px}
.mast h1{margin:0;font-family:"Aref Ruqaa","Noto Naskh Arabic",serif;font-weight:700;font-size:clamp(34px,8vw,68px);line-height:1.7}
.mast p{margin:0;font-size:15px}
.wrap{max-width:980px;margin:0 auto;padding:0 18px}
nav{border-bottom:2px solid #000;background:#fff;position:sticky;top:0;z-index:5}
nav .wrap{display:flex;gap:4px;overflow-x:auto}
nav button{font:inherit;font-size:17px;font-weight:700;background:none;border:0;border-bottom:4px solid transparent;color:#000;padding:8px 14px;cursor:pointer;white-space:nowrap}
nav button[aria-pressed="true"]{border-bottom-color:#000}
button:focus-visible{outline:3px solid #000;outline-offset:2px}
h2.sec{font-size:26px;margin:24px 0 0;padding-bottom:6px;border-bottom:1px solid #000}
article{padding:18px 0;border-bottom:1px solid #000}
.kind{font-size:14px;font-weight:700}
article h3{margin:0;font-size:26px;line-height:1.6}
article p{margin:4px 0;max-width:68ch}
.more{display:none}
article.open .more{display:block}
.toggle{font:inherit;font-size:15px;font-weight:700;background:none;border:0;border-bottom:2px solid #000;padding:0;cursor:pointer;color:#000}
.top h3{font-size:clamp(30px,6vw,46px)}
.intro{padding:40px 0 30px;text-align:center}.intro p{margin:0 auto;max-width:34ch;font-size:clamp(26px,5vw,38px);font-weight:700;line-height:1.9}.intro .sub{margin-top:22px;font-size:clamp(20px,3.5vw,26px);font-weight:400;max-width:40ch}.empty{padding:30px 0}
footer{border-top:6px solid #000;margin-top:30px;padding:16px 0 28px;text-align:center;font-size:15px}
</style>
</head>
<body>
<header class="mast">
  <h1>جَرِيدَةُ الفَجْرِ المُسْتَقِلَّةِ</h1>
  <p id="date"></p>
</header>
<nav aria-label="الأقسام"><div class="wrap" id="tabs"></div></nav>
<main class="wrap">
  <h2 class="sec" id="title"></h2>
  <section id="list"></section>
</main>
<footer>© جريدة الفجر المستقلة</footer>
<script>
const NEWS=[
{c:"الوثائقيات",t:"وثائقي: أهرامات مروي وأسرار مملكة كوش",s:"رحلة إلى البجراوية حيث تقف أهرامات الحضارة الكوشية.",b:"يعرض الوثائقي تاريخ مملكة كوش ومدينة مروي القديمة، وتُعد الأهرامات السودانية من أكثر الآثار تميزًا في إفريقيا."},
{c:"الوثائقيات",t:"وثائقي: ملتقى النيلين في الخرطوم",s:"حيث يلتقي النيل الأبيض بالنيل الأزرق ليكوّنا نهر النيل.",b:"قصة المقرن وعلاقة أهل السودان بالنيل، من الزراعة والصيد إلى الأدب والأغاني."},
{c:"الوثائقيات",t:"وثائقي: ستات الشاي وحكايات الشارع السوداني",s:"نساء يصنعن مشهدًا يوميًا مألوفًا في مدن السودان.",b:"تتبّع الوثائقي يوميات بائعات الشاي والقهوة، وكيف أصبحت مجالسهن مساحة للحديث ولقاء الناس."},
{c:"سياسة",t:"متابعة الجهود المبذولة لدعم الحوار والاستقرار",s:"تقرير عن المبادرات الهادفة إلى تحقيق السلام في السودان.",b:"نرصد هنا تصريحات الأطراف المعنية والمبادرات الإقليمية والدولية، مع الاعتماد على مصادر موثقة."},
{c:"اقتصاد",t:"الصمغ العربي والسمسم: أهم صادرات السودان الزراعية",s:"يعد السودان من أكبر منتجي الصمغ العربي في العالم.",b:"يعتمد قطاع واسع من السكان على الزراعة والرعي، وتبقى الحبوب والسمسم والفول السوداني من أبرز المحاصيل."},
{c:"رياضة",t:"صقور الجديان: أخبار المنتخب السوداني",s:"متابعة لاستعدادات المنتخب الوطني ومبارياته القادمة.",b:"نغطي أخبار اللاعبين والجهاز الفني ونتائج الأندية السودانية، ومنها الهلال والمريخ."},
{c:"ثقافة",t:"الأدب السوداني: من الطيب صالح إلى الأجيال الجديدة",s:"السودان بلد الشعر والرواية والأغنية الأصيلة.",b:"نستعيد أعمال كبار الأدباء والفنانين السودانيين، ونسلّط الضوء على المواهب الشابة في الأدب والموسيقى والفن التشكيلي."}
];
const cats=["الرئيسية","الوثائقيات","سياسة","اقتصاد","رياضة","ثقافة"];
let cur="الرئيسية";
const $=id=>document.getElementById(id);
try{$("date").textContent=new Date().toLocaleDateString("ar",{weekday:"long",year:"numeric",month:"long",day:"numeric"})}catch(e){}
function tabs(){
  $("tabs").innerHTML="";
  cats.forEach(c=>{const b=document.createElement("button");b.textContent=c;b.setAttribute("aria-pressed",c===cur);b.onclick=()=>{cur=c;tabs();render()};$("tabs").appendChild(b)});
}
function card(n,top){
  const a=document.createElement("article");
  if(top)a.className="top";
  a.innerHTML=`<div class="kind">${n.c}</div><h3>${n.t}</h3><p>${n.s}</p><p class="more">${n.b}</p><button class="toggle" aria-expanded="false">اقرأ المزيد</button>`;
  const btn=a.querySelector(".toggle");
  btn.onclick=()=>{const o=a.classList.toggle("open");btn.textContent=o?"إخفاء":"اقرأ المزيد";btn.setAttribute("aria-expanded",o)};
  return a;
}
function render(){
  $("list").innerHTML="";
  if(cur==="الرئيسية"){
    $("title").textContent="عن الجريدة";
    $("list").innerHTML='<div class="intro"><p>نحن شباب سودانيون نسعى لبناء سودان مدني حر جديد يسع الجميع.</p><p class="sub">جريدة الفجر جريدة مستقلة تمامًا.</p></div>';
    return;
  }
  $("title").textContent=cur;
  const items=NEWS.filter(n=>n.c===cur);
  if(!items.length){$("list").innerHTML='<p class="empty">لا توجد مواد في هذا القسم بعد.</p>';return}
  items.forEach(n=>$("list").appendChild(card(n,false)));
}
tabs();render();
</script>
</body>
</html>
